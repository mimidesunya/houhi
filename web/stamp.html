<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>号証スタンプ - 法匪 HOUHI Web</title>
  <meta name="description" content="PDFや画像の右上に号証番号を入れます。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&text=%E7%94%B2%E4%B9%99%E4%B8%99%E4%B8%81%E6%88%8A%E7%96%8E%E8%A8%BC%E5%8F%B70123456789-%E3%81%AE" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="法匪 HOUHI Web">
      <span class="brand-mark">法</span>
      <span>法匪 Web</span>
    </a>
    <nav class="site-nav" aria-label="主要ナビゲーション">
      <a href="./">Home</a>
      <a href="./drafting.html">起案</a>
      <a href="./archive.html">AIアーカイブ</a>
      <a href="./pdf.html">PDF</a>
      <a href="./stamp.html">号証スタンプ</a>
      <a href="./fax.html">FAX用PDF</a>
      <a href="https://github.com/mimidesunya/houhi">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="quiet-title">
      <p class="eyebrow">Evidence stamp</p>
      <h1>号証スタンプ</h1>
    </section>

    <section class="stamp-layout" aria-label="号証スタンプ作成">
      <div class="stamp-controls">
        <div id="stampDropZone" class="drop-zone stamp-drop-zone" tabindex="0" role="button">
          <strong>PDF / 画像をドロップ</strong>
          <span>甲1_契約書.pdf、乙2_写真.jpg のようなファイル名から読み取ります。</span>
        </div>

        <div class="stamp-options">
          <label class="check-row">
            <input id="stampAllPages" type="checkbox">
            <span>全ページに押す</span>
          </label>
          <label class="check-row">
            <input id="stampNoBlankPages" type="checkbox">
            <span>結合PDFに空白ページを入れない</span>
          </label>
        </div>

        <div class="archive-actions">
          <button id="chooseStampFilesButton" type="button">ファイルを選択</button>
          <button id="stampButton" type="button" class="primary-button">スタンプ</button>
        </div>

        <p id="stampSummary" class="status">PDF、JPG、PNGを選択してください。</p>
        <p id="stampStatus" class="status">未選択</p>
        <div class="progress-block" aria-label="号証スタンプ進捗">
          <progress id="stampProgress" max="1" value="0"></progress>
          <span id="stampProgressText" class="status">0%</span>
        </div>
        <input id="stampFileInput" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" multiple hidden>
      </div>

      <div class="stamp-log-pane">
        <div class="pane-toolbar">
          <div>
            <p class="eyebrow">Log</p>
            <h2>処理内容</h2>
          </div>
        </div>
        <textarea id="stampLog" class="stamp-log" readonly aria-label="号証スタンプ処理内容"></textarea>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="./stamp.js"></script>
</body>
</html>
