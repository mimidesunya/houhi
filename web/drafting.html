<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>起案 - 法匪 HOUHI Web</title>
  <meta name="description" content="作成したい書面を選び、Chat AIへの引継書をコピーします。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="法匪 HOUHI Web">
      <span class="brand-mark">法</span>
      <span>法匪 Web</span>
    </a>
    <nav class="site-nav" aria-label="主要ナビゲーション">
      <a href="./">Home</a>
      <a href="./pdf.html">PDF</a>
      <a href="https://github.com/mimidesunya/houhi">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="quiet-title">
      <p class="eyebrow">Drafting</p>
      <h1>起案</h1>
    </section>

    <section class="drafting-layout" aria-label="Chat AIへの引継書作成">
      <div class="drafting-controls">
        <label for="templateSelect">書面</label>
        <select id="templateSelect"></select>
        <button id="copyHandoffButton" type="button">引継書をコピー</button>
        <p id="copyStatus" class="status">未コピー</p>
        <div id="aiLinks" class="ai-links" hidden aria-label="引継ぎ先AI">
          <p>各AIにペーストしてください。</p>
          <a href="https://chatgpt.com/" target="_blank" rel="noreferrer">ChatGPT</a>
          <a href="https://claude.ai/new" target="_blank" rel="noreferrer">Claude</a>
          <a href="https://gemini.google.com/app" target="_blank" rel="noreferrer">Gemini</a>
        </div>
      </div>

      <textarea id="handoffOutput" class="handoff-output" readonly aria-label="Chat AIへの引継書"></textarea>
    </section>
  </main>

  <script src="./drafting-data.js"></script>
  <script src="./drafting.js"></script>
</body>
</html>
