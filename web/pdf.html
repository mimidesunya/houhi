<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF変換 / 印刷 - 法匪 HOUHI Web</title>
  <meta name="description" content="Markdownを裁判文書レイアウトでプレビューし、ブラウザの印刷機能でPDF保存できます。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="法匪 HOUHI Web">
      <span class="brand-mark">法</span>
      <span>法匪 Web</span>
    </a>
    <nav class="site-nav" aria-label="主要ナビゲーション">
      <a href="./">Home</a>
      <a href="./usage.html">使い方</a>
      <a href="./drafting.html">起案</a>
      <a href="./archive.html">AIアーカイブ</a>
      <a href="./stamp.html">号証スタンプ</a>
      <a href="./fax.html">FAX用PDF</a>
      <a href="https://github.com/mimidesunya/houhi">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="quiet-title">
      <div>
        <p class="eyebrow">PDF conversion / print</p>
        <h1>PDF変換 / 印刷</h1>
      </div>
    </section>

    <section id="preview" class="workspace" aria-label="Markdown PDF プレビュー">
      <div class="editor-pane">
        <div class="pane-toolbar">
          <div>
            <p class="eyebrow">Input</p>
            <h2>Markdown</h2>
          </div>
          <button id="pasteButton" type="button">ペースト</button>
        </div>

        <div id="dropZone" class="drop-zone" tabindex="0" role="button">
          <strong>.md または書面フォルダをドロップ</strong>
          <span>クリックしてMarkdownを選択、または下の欄へ直接ペースト</span>
          <input id="fileInput" type="file" accept=".md,text/markdown,text/plain" hidden>
        </div>

        <textarea id="markdownInput" spellcheck="false" aria-label="Markdown入力"></textarea>

        <section class="image-assets-panel" aria-label="画像">
          <div class="asset-toolbar">
            <div>
              <p class="eyebrow">Images</p>
              <h2>画像</h2>
            </div>
            <div class="asset-actions">
              <button id="imageFileButton" type="button">画像追加</button>
              <button id="imageFolderButton" type="button">フォルダ追加</button>
            </div>
          </div>
          <div id="assetDropZone" class="drop-zone image-drop-zone" tabindex="0" role="button">
            <strong>画像・画像フォルダをドロップ</strong>
            <span>Markdownタグ例を下に表示</span>
          </div>
          <input id="imageFileInput" type="file" accept="image/*" multiple hidden>
          <input id="imageDirectoryInput" type="file" webkitdirectory directory multiple hidden>
          <div id="imageAssetList" class="image-asset-list" aria-live="polite">
            <p class="asset-empty">画像未読込</p>
          </div>
        </section>
      </div>

      <div class="preview-pane">
        <div class="pane-toolbar">
          <div>
            <p class="eyebrow">Preview</p>
            <h2>ページレイアウト</h2>
          </div>
          <div class="preview-actions">
            <span id="previewStatus" class="status">準備中...</span>
            <button id="renderButton" type="button" class="preview-button">プレビュー更新</button>
            <button id="htmlPreviewButton" type="button" class="preview-button">HTML表示</button>
            <button id="printButton" type="button" class="print-button">印刷 / PDF保存</button>
          </div>
        </div>
        <div id="previewSurface" class="preview-surface">
          <div id="previewViewport" class="preview-viewport">
            <iframe id="previewFrame" title="裁判文書プレビュー"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
