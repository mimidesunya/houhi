<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIアーカイブ - 法匪 HOUHI Web</title>
  <meta name="description" content="Markdownとテキスト資料をAIへ渡すZIPにまとめます。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="法匪 HOUHI Web">
      <span class="brand-mark">法</span>
      <span>法匪 Web</span>
    </a>
    <nav class="site-nav" aria-label="主要ナビゲーション">
      <a href="./">Home</a>
      <a href="./drafting.html">起案</a>
      <a href="./pdf.html">PDF</a>
      <a href="./stamp.html">号証スタンプ</a>
      <a href="./fax.html">FAX用PDF</a>
      <a href="https://github.com/mimidesunya/houhi">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="quiet-title">
      <p class="eyebrow">AI archive</p>
      <h1>AIアーカイブ</h1>
    </section>

    <section class="archive-layout" aria-label="AIアーカイブ作成">
      <div class="archive-controls">
        <div id="archiveDropZone" class="drop-zone archive-drop-zone" tabindex="0" role="button">
          <strong>フォルダまたはファイルをドロップ</strong>
          <span>.md / .txt を収録し、その他のファイルは目録にだけ記録します。</span>
        </div>

        <div class="archive-actions">
          <button id="chooseDirectoryButton" type="button">フォルダを選択</button>
          <button id="createArchiveButton" type="button" class="primary-button">ZIP作成</button>
        </div>

        <p id="fileSummary" class="status">.md / .txt を含むフォルダを選択、またはファイルをドロップしてください。</p>
        <p id="archiveStatus" class="status">未選択</p>

        <input id="directoryInput" type="file" webkitdirectory directory multiple hidden>
      </div>

      <div class="archive-guide">
        <div class="pane-toolbar">
          <div>
            <p class="eyebrow">Prompt</p>
            <h2>Chat AIへの指示文</h2>
          </div>
          <button id="copyArchiveGuideButton" type="button">コピー</button>
        </div>
        <textarea id="archiveGuideOutput" class="archive-guide-output" readonly aria-label="Chat AIへの指示文"></textarea>
        <div id="archiveLinks" class="ai-links archive-ai-links" hidden aria-label="アップロード先AI">
          <p>ZIPをアップロードし、指示文をペーストしてください。</p>
          <a href="https://chatgpt.com/" target="_blank" rel="noreferrer">ChatGPT</a>
          <a href="https://claude.ai/new" target="_blank" rel="noreferrer">Claude</a>
          <a href="https://gemini.google.com/app" target="_blank" rel="noreferrer">Gemini</a>
        </div>
      </div>
    </section>
  </main>

  <script src="./archive-data.js"></script>
  <script src="./archive.js"></script>
</body>
</html>
